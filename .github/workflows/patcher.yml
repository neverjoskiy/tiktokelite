name: Elite Patcher APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure Android packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Restore patcher keystore
        run: |
          echo "${{ secrets.PATCHER_KEYSTORE_BASE64 }}" | base64 -d > /tmp/elite-patcher.jks

      - name: Build release APK
        run: gradle -q :app:assembleRelease

      - name: Align and sign
        env:
          KS_PASS: ${{ secrets.PATCHER_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.PATCHER_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PATCHER_KEY_ALIAS }}
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          OUT=elite-patcher.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -f 4 "$APK" aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks /tmp/elite-patcher.jks \
            --ks-pass:env KS_PASS --key-pass:env KEY_PASS --ks-key-alias "$KEY_ALIAS" \
            --out "$OUT" aligned.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT" | head -3
          echo "size=$(stat -c%s "$OUT")"
          echo "sha256=$(sha256sum "$OUT" | cut -d' ' -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: elite-patcher
          path: patcher/elite-patcher.apk
